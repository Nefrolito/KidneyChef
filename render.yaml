services:
  - type: web
    name: kidneychef-api
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Clave secreta de RevenueCat (sk_...), para comprobar el nivel de
      # suscripción en el servidor. Se pega a mano en el panel de Render.
      - key: REVENUECAT_SECRET_KEY
        sync: false
      # observar: solo registra en el log qué rechazaría (ver server.py).
      # exigir: responde 403 a quien no tiene el nivel. apagado: nada.
      - key: NIVEL_MODO
        value: observar
      # Último día en que se puede abrir la app web compartida por fuera de
      # la App Store (hora de Chile). Vacío = sin vencimiento. Cambiar la
      # fecha acá y volver a desplegar, o editarla en el panel de Render.
      - key: DEMO_HASTA
        value: "2026-10-31"
      # Clave que firma los links de invitación a la app web
      # (scripts/crear_invitacion.py). Se pega a mano en el panel de Render,
      # igual que en el .env. Cambiarla anula todas las invitaciones.
      - key: INVITACION_SECRETO
        sync: false
