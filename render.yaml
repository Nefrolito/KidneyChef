services:
  - type: web
    name: kidneychef-api
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Último día en que se puede abrir la app web compartida por fuera de
      # la App Store (hora de Chile). Vacío = sin vencimiento. Cambiar la
      # fecha acá y volver a desplegar, o editarla en el panel de Render.
      - key: DEMO_HASTA
        value: "2026-10-31"
